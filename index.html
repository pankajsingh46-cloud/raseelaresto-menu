        /* --------------------------------------------------
           🎨 CSS VARIABLES & THEME
        -------------------------------------------------- */
        :root {
            --primary-color: #e67e22;
            --secondary-color: #d35400;
            --accent-green: #27ae60;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Hind', sans-serif;
            /* ✨ Dark Reddish-Black Gradient Body Background ✨ */
            background: linear-gradient(135deg, #2b0505 0%, #000000 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            padding-bottom: 80px; 
            min-height: 100vh;
        }

        /* --------------------------------------------------
           HEADER (FIXED FOR SIGNBOARD IMAGE) 🛠️
        -------------------------------------------------- */
        .sticky-header {
            /* 👇 Image path: images/header.jpeg*/
            background-image: url('images/header.jpeg');
            
            /* Stretch to fit perfectly */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            
            /* Height adjusted for visibility */
            height: 100px; 
            width: 100%;
            
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            background-color: #fff; /* Fallback */
        }

        /* Text hidden because it's already in the photo */
        .brand-name, .brand-tagline {
            display: none; 
        }

        /* --------------------------------------------------
           MAIN SECTIONS
        -------------------------------------------------- */
        .menu-container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .main-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: none;
        }

        .section-header {
            position: relative;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease, filter 0.3s ease;
            filter: brightness(0.55);
            z-index: 1;
        }

        .section-header.active .header-bg {
            filter: brightness(0.4);
            transform: scale(1.05);
        }

        .section-title {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            width: 100%;
            text-align: center;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chevron {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .section-header.active .chevron {
            transform: rotate(180deg);
        }

        /* --------------------------------------------------
           SECTION CONTENT (LIGHT GRADIENT) 🎨
        -------------------------------------------------- */
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            
            /* ✨ New Light Gradient Background inside menu ✨ */
            background: linear-gradient(to bottom, #ffffff 0%, #fff6e6 100%);
        }

        .subsection-container {
            padding: 5px 20px 20px 20px;
        }

        .subsection-title {
            color: var(--secondary-color);
            font-size: 1.1rem;
            font-weight: 600;
            margin: 25px 0 15px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #ffccbc;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        /* --------------------------------------------------
           MENU ITEMS
        -------------------------------------------------- */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
            position: relative;
        }

        .item-left {
            flex: 1;
            padding-right: 15px;
        }

        .item-name {
            font-weight: 600;
            font-size: 1rem;
            color: #2c3e50;
            line-height: 1.35;
        }

        .veg-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 1px solid var(--accent-green);
            padding: 2px;
            margin-right: 8px;
            vertical-align: middle;
            margin-top: -3px;
            border-radius: 2px;
        }
        .veg-icon::after {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: var(--accent-green);
            border-radius: 50%;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            color: var(--secondary-color);
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        -------------------------------------------------- */

            font-size: 0.6rem;

                    }
                ]
            },
            {
                title: "Desserts",
                subsections: [
                    {
                        title: "Ice Cream Scoops",
                        items: [
                            { name: "Vanilla Ice Cream", price: "69" },
                            { name: "Strawberry Ice Cream", price: "79" },
                            { name: "Chocolate Ice Cream", price: "79" },
                            { name: "Black Currant Ice Cream", price: "89" }
                        ]
                    },
                    {
                        title: "Cheese Cakes",
                        items: [
                            { name: "Blueberry Cheese Cake", price: "89" },
                            { name: "Mango Cheese Cake", price: "89" },
                            { name: "Strawberry Cheese Cake", price: "89" },
                            { name: "Coffee Cheese Cake", price: "89", badge: "Chef Recommended" }
                        ]
                    },
                    {
                        title: "Indian Sweets",
                        items: [
                            { name: "Gulab Jamun (2 pcs)", price: "89" },
                            { name: "Rabri", price: "109" },
                            { name: "Rabri Gulab Jamun (1 pc)", price: "119", badge: "Rasela Special" },
                            { name: "Shahi Tukda with Rabri", price: "129" },
                            { name: "Lachha Kulfi (Seasonal)", price: "149" }
                        ]
                    }
                ]
            }
        ];

        // --------------------------------------------------
        // RENDER LOGIC
        // --------------------------------------------------
        const root = document.getElementById('menu-root');

        function renderMenu() {
            root.innerHTML = '';

            menuData.forEach((section, index) => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'main-section';

                const bgImage = sectionImages[section.title] ? `url('${sectionImages[section.title]}')` : 'none';
                const bgColor = sectionImages[section.title] ? 'transparent' : 'var(--primary-color)';

                const header = document.createElement('div');
                header.className = 'section-header';
                if(!sectionImages[section.title]) header.style.background = bgColor;

                header.innerHTML = `
                    <div class="header-bg" style="background-image: ${bgImage}"></div>
                    <div class="section-title">
                        ${section.title} <span class="chevron">▼</span>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'section-content';

                section.subsections.forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'subsection-container';
                    
                    subDiv.innerHTML = `<h3 class="subsection-title">${sub.title}</h3>`;

                    sub.items.forEach(item => {
                        const badgeHtml = item.badge 
                            ? `<span class="badge ${item.badge.includes('Chef') ? 'badge-chef' : 'badge-special'}">${item.badge.includes('Chef') ? 'Chef\'s Pick' : 'Special'}</span>` 
                            : '';
                        
                        const descHtml = item.desc 
                            ? `<div class="item-desc">${item.desc}</div>` 
                            : '';

                        const itemHtml = `
                            <div class="menu-item">
                                <div class="item-left">
                                    <div class="item-name">
                                        <span class="veg-icon"></span>
                                        ${item.name}
                                        ${badgeHtml}
                                    </div>
                                    ${descHtml}
                                </div>
                                <div class="item-price">₹${item.price}</div>
                            </div>
                        `;
                        subDiv.insertAdjacentHTML('beforeend', itemHtml);
                    });

                    content.appendChild(subDiv);
                });

                sectionEl.appendChild(header);
                sectionEl.appendChild(content);
                root.appendChild(sectionEl);

                header.addEventListener('click', () => {
                    const isActive = header.classList.contains('active');
                    
                    document.querySelectorAll('.section-header').forEach(h => h.classList.remove('active'));
                    document.querySelectorAll('.section-content').forEach(c => c.style.maxHeight = null);

                    if (!isActive) {
                        header.classList.add('active');
                        content.style.maxHeight = content.scrollHeight + "px";
                        
                        setTimeout(() => {
                            header.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 300);
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderMenu);

    </script>
</body>
</html>
